spring.application.name=ecommerce-backend
server.port=8080

# Default local development profile: use H2 so the app can start without a local MySQL instance.
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Production profile values for MySQL (override with environment variables in Docker/production)
# Uncomment and set as needed or let Docker Compose / environment variables override them
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Environment-backed datasource (Docker/CI): if SPRING_DATASOURCE_URL is present it will be used
# Note: Spring Boot supports environment property names like SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommerce;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate dialect fallback
spring.jpa.properties.hibernate.dialect=${SPRING_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT settings (replace with a strong secret in real deployment)
app.jwt.secret=${APP_JWT_SECRET:ecommerce-secret-key-change-me}
app.jwt.expiration-ms=86400000

# Security / actuator config
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
